provider: scaleway
pitfalls:
    - resource: scaleway_instance_server
      rule: '`scaleway_instance_server` has no attribute `private_ip` — use `private_ips` instead. The provider error suggested this directly: `Did you mean "private_ips"?`. Update every reference (`server_ips`, outputs, depends_on, etc.) to the suggested attribute name.'
      source: descriptive
      discovered_from: web-app-paris-pinned
    - resource: scaleway_instance_server
      rule: |-
        Attach a `scaleway_instance_server` to its private network with the
        provider's INLINE block, not a standalone `scaleway_instance_private_nic`:

          resource "scaleway_instance_server" "web" {
            private_network { pn_id = scaleway_vpc_private_network.main.id }
          }

        `vpc_required` accepts either shape, and the Layer 3 gate REFUSES the
        standalone NIC, so this is not a preference. Up to 8 blocks; with `count`
        the block comes too. No `project_id`.

        Neither shape destroys cleanly: a private NIC is deletable only while its
        server is POWERED OFF, and that precondition is the API's, not the HCL's
        (measured 2026-09-09 and 2026-09-10). Use the inline block because it is
        the smaller stack the gate accepts -- not because it solves teardown.
      source: fix
      discovered_from: web-live-paris
    - resource: scaleway_k8s_cluster
      rule: 'Version and auto_upgrade MUST be consistent: WITHOUT auto_upgrade use a full patch version like "1.31.2"; WITH auto_upgrade enabled use ONLY a minor version like "1.31".'
      source: descriptive
      discovered_from: full-stack-paris
    - resource: scaleway_lb_backend
      rule: "exit status 1 | stderr: ╷\n│ Error: Invalid index\n│ \n│   on loadbalancer.tf line 19, in resource \"scaleway_lb_backend\" \"web\":\n│   19:     scaleway_instance_server.web_1.private_ips[0].address,\n│     ├────────────────\n│     │ scaleway_instance_serve..."
      source: descriptive
      discovered_from: incremental-project-paris
    - resource: scaleway_lb_backend
      rule: |-
        NEVER index a resource attribute directly. Write
        `try(scaleway_instance_private_nic.web.private_ips[0].address, "")` or
        `one(...)`, not `scaleway_instance_private_nic.web.private_ips[0].address`.

        Not just about apply failing: `tofu destroy` EVALUATES THE CONFIGURATION
        rather than replaying state, so an expression that cannot be evaluated
        breaks destroy too -- what the half-finished apply created cannot be
        removed, and deleting the run project does not help because Scaleway
        refuses to delete a project holding resources. Recovery is manual.

        `private_ips` and `private_network` are empty until after apply. `var.` and
        `local.` are known at plan time and safe to index. The Layer 3 preflight
        refuses the unguarded form, so generating it fails before anything exists.
      source: avoid
      discovered_from: web-live-paris
    - resource: scaleway_domain_record
      rule: "exit status 1 | stderr: ╷\n│ Error: scaleway-sdk-go: resource  with ID  is not found\n│ \n│   with scaleway_domain_record.app,\n│   on dns.tf line 1, in resource \"scaleway_domain_record\" \"app\":\n│    1: resource \"scaleway_domain_record\" \"app\" {\n│ \n╵"
      source: descriptive
      discovered_from: web-app-paris
    - resource: scaleway_rdb_instance
      rule: |-
        exit status 1 | stderr: ╷ Fix observed in scenario "full-stack-paris": add the following HCL.
        resource "scaleway_rdb_instance" "postgres" {
          name               = "postgres-db"
          user_name          = "admin"
            enable_ipam = true
        }
      source: fix
      discovered_from: full-stack-paris
    - resource: scaleway_vpc_private_network
      rule: "exit status 1 | stderr: ╷\n│ Error: scaleway-sdk-go: resource  with ID  is not found\n│ \n│   with scaleway_vpc_private_network.main,\n│   on network.tf line 1, in resource \"scaleway_vpc_private_network\" \"main\":\n│    1: resource \"scaleway_vpc_private_network\" \"main\" {\n│ \n╵"
      source: descriptive
      discovered_from: web-live-paris
    - resource: scaleway_instance_security_group
      rule: |-
        NEVER declare a `scaleway_instance_security_group`. It is not in
        `allow_resource_types`, so Layer 3 refuses the whole configuration before
        anything is applied and the run loses an iteration to it.

        You do not need one. Scaleway CREATES a "Default security group" in every
        project on the first instance, and it permits what these scenarios need.
        Declaring your own adds a resource the allowlist rejects to solve a problem
        that does not exist.

        The API-created one is also why teardown has a purge step: Terraform never
        owns it, so `destroy` never removes it, and an undeleted security group
        blocks the run project from being deleted afterwards. One more reason not
        to add a second.
      source: avoid
      discovered_from: web-live-paris
    # RETRACTED 2026-09-10, one day after it was written. It said: when a
    # scenario declares a `service:`, boot Scaleway's `docker` image instead of
    # apt-installing a runtime, and it cited the marketplace API as proof the
    # image was compatible with DEV1-S in fr-par-1.
    #
    # The generator took the advice and the apply FAILED:
    #
    #   could not get image 'fr-par-1/docker': couldn't find a local image for
    #   the given zone (fr-par-1) and commercial type (DEV1-M)
    #
    # The marketplace API still says the opposite -- all four fr-par-1 `docker`
    # local images list DEV1-M in compatible_commercial_types. So
    # `compatible_commercial_types` is NOT what the provider resolves against,
    # and it cannot be used to settle this question.
    #
    # That is the second time this exact failure has been recorded, and the
    # pitfall below already warned against writing a remedy for it. Overriding
    # that warning turned an honest "not understood" into a prescription that
    # cost a real apply. The warning stands; no remedy is offered.
    #
    # What IS supported by evidence: `ubuntu_jammy` plus an apt install serves
    # inside a 120s probe window (web-live-paris, 2026-09-10 09:35, probe
    # passed). Slower, and it works.
    # Left DESCRIPTIVE on purpose, and it is worth saying why.
    #
    # The obvious remedy -- "the model invented an image, use ubuntu_jammy" -- is
    # WRONG. `docker` is a real Scaleway marketplace label and it is what this
    # scenario's own variables.tf defaults to.
    #
    # 2026-09-09, asked the public marketplace API directly:
    #
    #   GET /marketplace/v2/local-images?image_label=docker&zone=fr-par-1
    #   -> 4 local images, x86_64, every one listing DEV1-S in
    #      compatible_commercial_types
    #
    # So the label, the zone and the commercial type ARE compatible, which means
    # the failure below was TRANSIENT -- a moment when fr-par-1 had no local image
    # to hand -- not a wrong image name. That is why there is still no prescriptive
    # remedy: "avoid `docker`" would teach the generator to route around a stock
    # blip, and `docker` is exactly the image a container workload should use (see
    # the pitfall above it).
    #
    # Writing a confident remedy for a symptom is how a symptom becomes a wrong
    # instruction the generator then follows.
    - resource: scaleway_instance_server
      rule: "exit status 1 | stderr: ╷\n│ Error: could not get image 'fr-par-1/docker': scaleway-sdk-go: couldn't find a local image for the given zone (fr-par-1) and commercial type (DEV1-S)\n│ \n│   with scaleway_instance_server.web,\n│   on compute.tf line 7, in resource \"scaleway_instance_server\" \"web\""
      source: descriptive
      discovered_from: web-live-paris
