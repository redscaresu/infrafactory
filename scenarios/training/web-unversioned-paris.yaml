scenario: web-unversioned-paris
version: "1.0"
cloud: scaleway
description: >
  A versioned web application that serves correctly and cannot prove what
  version it is running. `tofu apply` succeeds, the load balancer marks
  the backend up, the http_probe passes and the orphan sweep is clean --
  and the service never names the tag the record claims.

  This is the failure class the live-observation arc exists for, and
  promotion.go calls it "the most dangerous shape live observation can
  find, because every other signal reports it as healthy". It is
  manufactured deliberately (S156e) so a live-sourced pitfall can be
  shown to prevent a repeat.

# The declared version_path is the whole experiment. Stock nginx serves
# its default index at `/` -- "Welcome to nginx!" -- which is a 200 and
# says nothing about 1.27, so the running version is UNCONFIRMED while
# every other signal is green.
#
# health_path stays `/` deliberately: the generated load balancer polls
# it with health_check_http, so a path nginx does not serve would mark
# the backend DOWN and fail the http_probe criterion -- turning this
# into a terraform-visible failure and destroying the thing being
# measured.
service:
  image: nginx
  tag: "1.27"
  port: 80
  health_path: /
  version_path: /
  ttl: 1h

resources:
  compute:
    purpose: web-server
    size: small
    count: 1
  networking:
    load_balancer:
      exposure: public
      backends:
        - port: 80
          protocol: http

acceptance_criteria:
  - type: policy
    check: region_restriction
    params:
      region: fr-par
    expect: pass
  # Expected to PASS. The scenario is satisfied at the infrastructure
  # layer and wrong at the service layer, and the gap between those two
  # is the experiment.
  - type: http_probe
    target: load_balancer
    port: 80
    expect: reachable
  - type: destruction
    expect: no_orphans
