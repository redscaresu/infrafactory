# Dependabot config — M82.
#
# Three ecosystems: Go modules, npm (UI), and GitHub Actions.
# Updates grouped per ecosystem to avoid PR noise (1 PR/week per
# ecosystem instead of N per dep). Auto-merge is intentionally NOT
# enabled — we want a human review pass on every bump given the
# May 2026 M76 incident (4 high-severity CVEs that needed a
# coordinated vite-8/sveltekit/vite-plugin-svelte/tailwindcss bump,
# not auto-mergeable individually).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ui-deps:
        patterns:
          - "*"
        # Exclude major bumps from the group so they get individual
        # review PRs (vite 7→8 / sveltekit 2→3 etc. are M76-class).
        #
        # typescript joined this list on 2026-08-23. Dependabot grouped
        # typescript 5.9.3 → 7.0.2 with four harmless patch bumps, and
        # @sveltejs/kit peers on `typescript: ^5.3.3 || ^6.0.0`, so
        # `npm ci` died with ERESOLVE and took the whole group down with
        # it (#130). One major poisoning four safe bumps is exactly what
        # this exclude list exists to prevent.
        exclude-patterns:
          - "vite"
          - "@sveltejs/kit"
          - "svelte"
          - "typescript"
      ui-majors:
        patterns:
          - "vite"
          - "@sveltejs/kit"
          - "svelte"
          - "typescript"
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
