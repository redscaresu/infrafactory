name: Release

# S150-T4. Third-party actions are pinned to commit SHAs in this workflow
# because it runs with elevated capability -- a mutable tag can be repointed
# at new code by a compromised upstream, and the release job holds a
# contents: write token. The `# vN` comment is what lets dependabot keep the
# pins current.
#
# ci.yml and doc-hygiene.yml stay on tags: they are read-only and hold no
# secrets, so pinning there would be churn without a threat to answer.
#
# The matrix only builds and uploads artifacts. The release job runs only
# after every leg succeeds. It refuses a tag that already has any release,
# then creates the release with the binaries attached. On a tag push gh
# creates the release as a draft, uploads to it and publishes it; a dry run
# stays a draft. A draft a failed run left behind is never deleted by this
# workflow: the refuse step names its id, and it is deleted by hand.
#
# A v0.0.0-dryrun-* tag is accepted only by workflow_dispatch, and dispatch
# accepts only that form. So the dry run cannot replace a real release, and
# its release is never published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dry-run tag, v0.0.0-dryrun-<name>; the release stays a draft'
        required: true

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Validate the version and the dry-run tag
        id: validate
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION '${VERSION}' is not vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          is_dryrun=false
          [[ "${VERSION}" == v0.0.0-dryrun-* ]] && is_dryrun=true
          if [[ "${is_dryrun}" != "${DRY_RUN}" ]]; then
            echo "only workflow_dispatch may release a v0.0.0-dryrun-* tag, and dispatch only those: '${VERSION}'" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set the build targets
        id: targets
        run: |
          echo 'targets=[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"}]' >> "${GITHUB_OUTPUT}"

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Build UI (embedded via go:embed)
        run: |
          cd ui && npm ci && npm run build
          cd ..
          rm -rf cmd/infrafactory/ui/build
          mkdir -p cmd/infrafactory/ui
          cp -R ui/build cmd/infrafactory/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BINARY_NAME="infrafactory-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${BINARY_NAME}" ./cmd/infrafactory
          (cd dist && sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256")

      - name: Upload binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrafactory-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/infrafactory-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/infrafactory-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          if-no-files-found: error

  release:
    # Waits for every matrix leg. A leg that fails or times out skips this
    # job, so no release is created.
    needs: [check, build]
    # GitHub keeps one pending run per group and cancels an older pending run
    # when a third arrives. So two runs on one tag queue, and the guard below
    # cannot race another run's publish. The build matrix is not in the group.
    concurrency:
      group: release-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGETS: ${{ needs.check.outputs.targets }}
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: infrafactory-*
          path: dist
          merge-multiple: true

      # dist/ must hold exactly the binary and .sha256 of each target, by name,
      # so a missing, renamed or extra file fails before anything is created.
      - name: Check dist/ holds exactly the expected files
        run: |
          expected=$(jq -r '.[] | "infrafactory-\(.goos)-\(.goarch)" as $b | $b, "\($b).sha256"' <<< "${TARGETS}" | sort)
          diff <(printf '%s\n' "${expected}") <(find dist -maxdepth 1 -type f -exec basename {} \; | sort)

      # Refuses if the tag has any release, and deletes nothing. A published one
      # is named as published. A draft, which a failed run may have left, has its
      # id named so it can be deleted by hand. A release with no draft field
      # counts as published, so the step fails closed. Each gh and jq call fails
      # the job on error.
      - name: Refuse when the tag already has a release
        run: |
          set -eo pipefail
          releases=$(gh api --paginate "repos/${GH_REPO}/releases") \
            || { echo "could not list the releases for ${VERSION}; nothing was changed" >&2; exit 1; }
          matches=$(jq -s -c --arg tag "${VERSION}" 'add // [] | map(select(.tag_name == $tag))' <<< "${releases}")
          published=$(jq '[.[] | select(.draft != true)] | length' <<< "${matches}")
          ids=$(jq -r '[.[].id | tostring] | join(", ")' <<< "${matches}")
          if [[ "${published}" != "0" ]]; then
            echo "release ${VERSION} is already published (ids: ${ids}); nothing was changed." >&2
            exit 1
          fi
          if [[ -n "${ids}" ]]; then
            echo "release ${VERSION} has a draft (id: ${ids}) from an earlier run; nothing was changed. Delete that draft by hand, then re-run." >&2
            exit 1
          fi

      # gh creates the release as a draft, uploads the files, then publishes it:
      # one release, one call. A dry run keeps it a draft. --verify-tag on a tag
      # push checks that the tag exists; a dry run has no tag yet.
      - name: Create the release with every file
        run: |
          set -eo pipefail
          flags=(--generate-notes)
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--draft)
          fi
          if [[ "${VERSION}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${VERSION}" dist/* "${flags[@]}"
