name: Release

# S150-T4. Third-party actions are pinned to commit SHAs in this workflow
# because it runs with elevated capability -- a mutable tag can be repointed
# at new code by a compromised upstream, and the release job holds a
# contents: write token. The `# vN` comment is what lets dependabot keep the
# pins current.
#
# ci.yml and doc-hygiene.yml stay on tags: they are read-only and hold no
# secrets, so pinning there would be churn without a threat to answer.
#
# The matrix only builds and uploads artifacts. The release job runs only
# after every leg succeeds. It refuses a tag that already has a published
# release, deletes that tag's drafts (never published, so nothing public
# changes), creates a fresh draft, uploads the binaries to it, and publishes
# it last. A failed run leaves at most a draft. The next run for the same tag
# deletes it; a draft for a dry-run tag or a tag never retried stays.
#
# A v0.0.0-dryrun-* tag is accepted only by workflow_dispatch, and dispatch
# accepts only that form. So the dry run cannot replace a real release, and
# its release is never published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dry-run tag, v0.0.0-dryrun-<name>; the release stays a draft'
        required: true

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Validate the version and the dry-run tag
        id: validate
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION '${VERSION}' is not vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          is_dryrun=false
          [[ "${VERSION}" == v0.0.0-dryrun-* ]] && is_dryrun=true
          if [[ "${is_dryrun}" != "${DRY_RUN}" ]]; then
            echo "only workflow_dispatch may release a v0.0.0-dryrun-* tag, and dispatch only those: '${VERSION}'" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set the build targets
        id: targets
        run: |
          echo 'targets=[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"}]' >> "${GITHUB_OUTPUT}"

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Build UI (embedded via go:embed)
        run: |
          cd ui && npm ci && npm run build
          cd ..
          rm -rf cmd/infrafactory/ui/build
          mkdir -p cmd/infrafactory/ui
          cp -R ui/build cmd/infrafactory/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BINARY_NAME="infrafactory-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${BINARY_NAME}" ./cmd/infrafactory
          (cd dist && sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256")

      - name: Upload binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrafactory-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/infrafactory-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/infrafactory-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          if-no-files-found: error

  release:
    # Waits for every matrix leg. A leg that fails or times out skips this
    # job, so no release is created.
    needs: [check, build]
    # GitHub keeps one pending run per group and cancels an older pending run
    # when a third arrives. So two runs on one tag queue, and the guard below
    # cannot race another run's publish. The build matrix is not in the group.
    concurrency:
      group: release-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGETS: ${{ needs.check.outputs.targets }}
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: infrafactory-*
          path: dist
          merge-multiple: true

      # dist/ must hold exactly the binary and .sha256 of each target, by name,
      # so a missing, renamed or extra file fails before anything is created.
      - name: Check dist/ holds exactly the expected files
        run: |
          expected=$(jq -r '.[] | "infrafactory-\(.goos)-\(.goarch)" as $b | $b, "\($b).sha256"' <<< "${TARGETS}" | sort)
          diff <(printf '%s\n' "${expected}") <(find dist -maxdepth 1 -type f -exec basename {} \; | sort)

      # Refuses a published release for the tag, and changes nothing then. Any
      # other release for the tag is a draft, and every such draft is deleted,
      # including one a person made by hand. Nothing public changes. Each gh
      # and jq call fails the job on error.
      - name: Refuse a published release, then delete the tag's drafts
        run: |
          set -eo pipefail
          releases=$(gh api --paginate "repos/${GH_REPO}/releases") \
            || { echo "could not list the releases for ${VERSION}; nothing was changed" >&2; exit 1; }
          matches=$(jq -s -c --arg tag "${VERSION}" 'add // [] | map(select(.tag_name == $tag))' <<< "${releases}")
          published=$(jq '[.[] | select(.draft == false)] | length' <<< "${matches}")
          if [[ "${published}" != "0" ]]; then
            echo "release ${VERSION} is already published; nothing was changed." >&2
            exit 1
          fi
          ids=$(jq -r '.[].id' <<< "${matches}")
          for id in ${ids}; do
            gh api -X DELETE "repos/${GH_REPO}/releases/${id}"
          done

      # Created here, not by an action, so the release id is known.
      - name: Create the draft release
        id: create
        run: |
          set -eo pipefail
          case "${VERSION}" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          id=$(gh api -X POST "repos/${GH_REPO}/releases" \
            -f tag_name="${VERSION}" -f target_commitish="${GITHUB_SHA}" \
            -F draft=true -F prerelease="${prerelease}" -F generate_release_notes=true \
            --jq .id)
          [[ "${id}" =~ ^[0-9]+$ ]] || { echo "GitHub returned no release id for ${VERSION}" >&2; exit 1; }
          echo "id=${id}" >> "${GITHUB_OUTPUT}"

      # Every file is attached to the draft by id, while it is still a draft.
      - name: Upload the binaries to the draft
        env:
          RELEASE_ID: ${{ steps.create.outputs.id }}
        run: |
          set -eo pipefail
          for file in dist/*; do
            gh api -X POST "https://uploads.github.com/repos/${GH_REPO}/releases/${RELEASE_ID}/assets?name=$(basename "${file}")" \
              -H "Content-Type: application/octet-stream" --input "${file}" > /dev/null
          done

      # Publishes by the id the create step returned, so it cannot publish a
      # different release with the same tag.
      - name: Publish the release
        if: ${{ github.event_name == 'push' }}
        env:
          RELEASE_ID: ${{ steps.create.outputs.id }}
        run: |
          set -eo pipefail
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -F draft=false
