name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# S150-T3. Without this the GITHUB_TOKEN gets the default scope, which is
# wider than any job here needs. Read-only is sufficient: nothing in CI
# writes to the repo. The job that will hold cloud credentials (S144) must
# declare its own narrower set rather than inherit anything from here.
permissions:
  contents: read

env:
  # M80 — opt into Node 24 ahead of GitHub's forced June 2 2026 flip
  # so any breakage in our Playwright + npm-install path surfaces on
  # our schedule rather than at 00:00 UTC. Set at workflow scope so
  # every job (test, gitleaks, build-binary) gets it uniformly.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # M78 — share provider downloads across runs (~200MB saved per
      # CI run; mirrors mockway's CI pattern).
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Prepare Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugin-cache-${{ runner.os }}-v1

      - name: Build UI (embedded via go:embed)
        # cmd/infrafactory/embed.go requires `cmd/infrafactory/ui/build/` to
        # exist at compile time. Both are gitignored, so CI must produce
        # them before any `go test`/`go build` of cmd/infrafactory runs.
        run: |
          cd ui && npm ci && npm run build
          cd ..
          rm -rf cmd/infrafactory/ui/build
          mkdir -p cmd/infrafactory/ui
          cp -R ui/build cmd/infrafactory/ui/

      - name: Run tests
        # M71: -race detects genuine Go data races (the 3 fakes all
        # run with -race; infrafactory was the only repo without it
        # despite being the most concurrency-heavy).
        # -count=2 surfaces parallel-subtest filesystem races that
        # would otherwise flake only in CI (e.g. the May 2026
        # regression where TestCommandOutputGoldenSnapshots/run_json
        # passed locally on macOS but failed on Linux because two
        # parallel subtests collided on the relative-path `./output`
        # default).
        run: go test -race -count=2 ./...

      # The UI suites were guarded by a local pre-commit hook and nothing
      # else, so they were exactly as strong as the discipline of whoever
      # was committing -- and `--no-verify` is one flag away.
      #
      # On 2026-09-19 the Deployments page was found announcing "10
      # deployments, 10 needing attention" for ten records the system
      # itself classified as released, while the account was empty. 153
      # unit tests and 135 browser tests existed. None of them ran on a
      # pull request, and a Playwright failure had been sitting on main
      # unnoticed.
      #
      # This project's whole discipline is that drift becomes a failed
      # test. A suite outside CI is a suite that drifts.
      - name: Run UI unit tests
        # Needs Node >= 22.18 (pinned in ui/package.json engines).
        # `tests/ws.test.js` imports `../src/lib/ws.ts` directly, and
        # native TypeScript type-stripping is what makes that work --
        # Node 20 cannot import a .ts file at all. The suite therefore
        # only ever passed on a developer's modern local Node, and CI
        # pinned 20, which is one reason nobody noticed the UI tests
        # were not running here.
        run: cd ui && npm test

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps chromium

      # Playwright starts the app with `go run ./cmd/infrafactory`, which
      # compiles it. Building first puts the artifacts in the cache so
      # that start is a link rather than a full build -- otherwise the
      # 180s webServer timeout is spent compiling instead of testing.
      - name: Warm the Go build cache for the test server
        run: go build -o /dev/null ./cmd/infrafactory

      - name: Run UI end-to-end tests
        # No credential stubbing needed: the runner has none, and
        # `reuseExistingServer: !process.env.CI` means CI always starts
        # its own server rather than adopting whatever is on :4173.
        #
        # That reuse is why this suite fails LOCALLY for anyone with the
        # demo UI running -- it adopts a server started with real
        # Scaleway credentials, and `scenario page shows Layer 3
        # section` correctly reports "credentials ready" where it
        # expected "credentials missing". The test is right; the local
        # environment is contaminated. Stop the UI on :4173 before
        # running `make test`.
        #
        # Visual regression is EXCLUDED, and that is a limitation rather
        # than a preference. `toHaveScreenshot()` baselines are
        # platform-specific: the repository has 8 `*-chromium-darwin.png`
        # and no `*-chromium-linux.png`, so on ubuntu-latest every one of
        # them fails on a missing baseline.
        #
        # Generating Linux baselines is not a one-liner: the config's
        # webServer is `go run ./cmd/infrafactory ui`, so the official
        # Playwright container -- which has Node and no Go -- cannot
        # start the app under test. Doing it properly needs an image with
        # both, and that is worth a separate change.
        #
        # So visual regression stays a local, macOS-only check, and the
        # 127 FUNCTIONAL end-to-end tests run here. That is the trade:
        # the pixels are still only as good as whoever last ran `make
        # test`, but behaviour is now gated.
        run: cd ui && npx playwright test --grep-invert "Visual regression"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  govulncheck:
    # S150-T1. Nothing scanned Go dependencies for known vulnerabilities
    # before this, so a vulnerable module could ship silently.
    #
    # Symbol-level (the default) rather than -scan module, deliberately.
    # The tree currently requires golang.org/x/crypto v0.53.0, which carries
    # GO-2026-5932 with "Fixed in: N/A" -- no fix exists. A module-level gate
    # would be permanently red with no remedy available, and a check nobody
    # can act on is a check everybody learns to ignore. Symbol-level fails
    # only when our code actually reaches the vulnerable path, which is the
    # question worth blocking a merge on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        # -tags noui, and NOT for convenience. cmd/infrafactory/embed.go
        # carries `//go:embed all:ui/build`, and that directory is generated
        # and gitignored, so on a clean runner it does not exist and
        # `go build ./...` fails to load that package.
        #
        # govulncheck does not fail on it -- it exits 0 and says nothing.
        # It simply cannot analyse a package that will not load, so the
        # scan would quietly cover less than it appears to. A green result
        # that skipped a package is the kind of false green this repo has
        # been bitten by before. The noui build tag swaps the embed for a
        # stub so every package loads and is actually scanned.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags noui ./...

  gitleaks:
    # M72: mirror the local pre-commit hook + the 3 sibling-fake CI
    # jobs. The pre-commit hook is bypassable with --no-verify and
    # does not run on fork PRs, so this job is the load-bearing
    # secret scan for OSS-fork contributions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --source=. --config .gitleaks.toml

  build-binary:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build UI (embedded via go:embed)
        run: |
          cd ui && npm ci && npm run build
          cd ..
          rm -rf cmd/infrafactory/ui/build
          mkdir -p cmd/infrafactory/ui
          cp -R ui/build cmd/infrafactory/ui/

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -o dist/infrafactory-linux-${{ matrix.arch }} ./cmd/infrafactory

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: infrafactory-linux-${{ matrix.arch }}
          path: dist/infrafactory-linux-${{ matrix.arch }}
