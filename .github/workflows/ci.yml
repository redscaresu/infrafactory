name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# S150-T3. Without this the GITHUB_TOKEN gets the default scope, which is
# wider than any job here needs. Read-only is sufficient: nothing in CI
# writes to the repo. The job that will hold cloud credentials (S144) must
# declare its own narrower set rather than inherit anything from here.
permissions:
  contents: read

env:
  # M80 — opt into Node 24 ahead of GitHub's forced June 2 2026 flip
  # so any breakage in our Playwright + npm-install path surfaces on
  # our schedule rather than at 00:00 UTC. Set at workflow scope so
  # every job (test, gitleaks, build-binary) gets it uniformly.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Decides once whether a PR changes only board files
  # (scripts/ci_board_only.sh). test-full, aws-e2e-full and govulncheck are
  # skipped only when this job succeeded and said skip, so a failure here, or
  # a push to main (which skips this job), runs every job in full.
  board:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The diff needs the merge base of the PR's base and head.
          fetch-depth: 0

      - name: Board-only check
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The base branch's copy of the script decides, so a PR cannot loosen
        # the gate that judges it: a change to the script is not a board file,
        # so that PR runs everything, the script's own test included. `bash` on
        # an empty file exits 0, so `git show` must succeed for a skip.
        run: |
          report="no scripts/ci_board_only.sh at the base: running the full jobs"
          if git show "$BASE_SHA:scripts/ci_board_only.sh" > "$RUNNER_TEMP/ci_board_only.sh" &&
            report="$(bash "$RUNNER_TEMP/ci_board_only.sh" "$BASE_SHA" "$HEAD_SHA")"; then
            # Every line here is the script's own or a board path, so none
            # can be the delimiter.
            { echo "skip=true"; echo "report<<REPORT_END"; echo "$report"; echo "REPORT_END"; } >> "$GITHUB_OUTPUT"
          fi
          echo "$report"

  # Board files link to each other, so a board-only PR still runs the doc
  # link test. `go test` exits 0 when the test no longer exists, so the step
  # passes only on its PASS line.
  doc-links:
    needs: board
    if: needs.board.outputs.skip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Doc links
        run: |
          go test ./internal/generator -run '^TestDocLinksResolve$' -count=1 -v | tee "$RUNNER_TEMP/doc-links.log"
          grep -q '^--- PASS: TestDocLinksResolve ' "$RUNNER_TEMP/doc-links.log"

  # The required checks are `test` and `aws-e2e`, so each always runs and
  # reports. A board-only PR passes on the board report (and, for test, the
  # doc link test); every other run passes only when its full job passed.
  test:
    needs: [board, doc-links, test-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Result
        env:
          SKIP: ${{ needs.board.result == 'success' && needs.board.outputs.skip == 'true' }}
          REPORT: ${{ needs.board.outputs.report }}
          DOC_LINKS: ${{ needs.doc-links.result }}
          FULL: ${{ needs.test-full.result }}
        run: |
          if [ "$SKIP" = true ]; then
            echo "$REPORT"
            echo "doc-links: $DOC_LINKS"
            [ "$DOC_LINKS" = success ]
          else
            echo "test-full: $FULL"
            [ "$FULL" = success ]
          fi

  aws-e2e:
    needs: [board, aws-e2e-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Result
        env:
          SKIP: ${{ needs.board.result == 'success' && needs.board.outputs.skip == 'true' }}
          REPORT: ${{ needs.board.outputs.report }}
          FULL: ${{ needs.aws-e2e-full.result }}
        run: |
          if [ "$SKIP" = true ]; then
            echo "$REPORT"
          else
            echo "aws-e2e-full: $FULL"
            [ "$FULL" = success ]
          fi

  test-full:
    needs: board
    if: ${{ !cancelled() && !(needs.board.result == 'success' && needs.board.outputs.skip == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # M78 — share provider downloads across runs (~200MB saved per
      # CI run; mirrors mockway's CI pattern).
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the board-only check
        run: bash scripts/ci_board_only_test.sh

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # Layer 3 teardown runs tofu, and the test that reproduces a stack
      # whose config cannot evaluate skips without it.
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_wrapper: false

      - name: Prepare Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugin-cache-${{ runner.os }}-v1

      - name: Build UI (embedded via go:embed)
        # cmd/infrafactory/embed.go requires `cmd/infrafactory/ui/build/` to
        # exist at compile time. Both are gitignored, so CI must produce
        # them before any `go test`/`go build` of cmd/infrafactory runs.
        run: |
          cd ui && npm ci && npm run build
          cd ..
          rm -rf cmd/infrafactory/ui/build
          mkdir -p cmd/infrafactory/ui
          cp -R ui/build cmd/infrafactory/ui/

      - name: Run tests
        # M71: -race detects genuine Go data races (the 3 fakes all
        # run with -race; infrafactory was the only repo without it
        # despite being the most concurrency-heavy).
        # -count=2 surfaces parallel-subtest filesystem races that
        # would otherwise flake only in CI (e.g. the May 2026
        # regression where TestCommandOutputGoldenSnapshots/run_json
        # passed locally on macOS but failed on Linux because two
        # parallel subtests collided on the relative-path `./output`
        # default).
        run: go test -race -count=2 ./...

      # The UI suites were guarded by a local pre-commit hook and nothing
      # else, so they were exactly as strong as the discipline of whoever
      # was committing -- and `--no-verify` is one flag away.
      #
      # On 2026-09-19 the Deployments page was found announcing "10
      # deployments, 10 needing attention" for ten records the system
      # itself classified as released, while the account was empty. 153
      # unit tests and 135 browser tests existed. None of them ran on a
      # pull request, and a Playwright failure had been sitting on main
      # unnoticed.
      #
      # This project's whole discipline is that drift becomes a failed
      # test. A suite outside CI is a suite that drifts.
      - name: Run UI unit tests
        # Needs Node >= 22.18 (pinned in ui/package.json engines).
        # `tests/ws.test.js` imports `../src/lib/ws.ts` directly, and
        # native TypeScript type-stripping is what makes that work --
        # Node 20 cannot import a .ts file at all. The suite therefore
        # only ever passed on a developer's modern local Node, and CI
        # pinned 20, which is one reason nobody noticed the UI tests
        # were not running here.
        run: cd ui && npm test

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps chromium

      # Playwright starts the app with `go run ./cmd/infrafactory`, which
      # compiles it. Building first puts the artifacts in the cache so
      # that start is a link rather than a full build -- otherwise the
      # 180s webServer timeout is spent compiling instead of testing.
      - name: Warm the Go build cache for the test server
        run: go build -o /dev/null ./cmd/infrafactory

      - name: Run UI end-to-end tests
        # No credential stubbing needed: the runner has none, and
        # `reuseExistingServer: !process.env.CI` means CI always starts
        # its own server rather than adopting whatever is on :4173.
        #
        # That reuse is why this suite fails LOCALLY for anyone with the
        # demo UI running -- it adopts a server started with real
        # Scaleway credentials, and `scenario page shows Layer 3
        # section` correctly reports "credentials ready" where it
        # expected "credentials missing". The test is right; the local
        # environment is contaminated. Stop the UI on :4173 before
        # running `make test`.
        #
        # Visual regression is EXCLUDED, and that is a limitation rather
        # than a preference. `toHaveScreenshot()` baselines are
        # platform-specific: the repository has 8 `*-chromium-darwin.png`
        # and no `*-chromium-linux.png`, so on ubuntu-latest every one of
        # them fails on a missing baseline.
        #
        # Generating Linux baselines is not a one-liner: the config's
        # webServer is `go run ./cmd/infrafactory ui`, so the official
        # Playwright container -- which has Node and no Go -- cannot
        # start the app under test. Doing it properly needs an image with
        # both, and that is worth a separate change.
        #
        # So visual regression stays a local, macOS-only check, and the
        # 127 FUNCTIONAL end-to-end tests run here. That is the trade:
        # the pixels are still only as good as whoever last ran `make
        # test`, but behaviour is now gated.
        #
        # The wrapper also fails the step if the server logged a run-mode
        # error: the specs answer run-mode themselves (ui/e2e/fixtures.ts).
        run: bash scripts/ui_e2e.sh --grep-invert "Visual regression"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  # AWS against fakeaws runs beside test-full, not after it: it was 506 of the
  # test job's 865 s, so CI (and every swarm story's wait on it) took the sum.
  # Its required check is `aws-e2e` above.
  aws-e2e-full:
    needs: board
    if: ${{ !cancelled() && !(needs.board.result == 'success' && needs.board.outputs.skip == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # Layer 3 teardown runs tofu, and the test that reproduces a stack
      # whose config cannot evaluate skips without it.
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_wrapper: false

      - name: Prepare Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugin-cache-${{ runner.os }}-v1

      - name: Build UI (embedded via go:embed)
        # cmd/infrafactory/embed.go requires `cmd/infrafactory/ui/build/` to
        # exist at compile time. Both are gitignored, so CI must produce
        # them before any `go test`/`go build` of cmd/infrafactory runs.
        run: |
          cd ui && npm ci && npm run build
          cd ..
          rm -rf cmd/infrafactory/ui/build
          mkdir -p cmd/infrafactory/ui
          cp -R ui/build cmd/infrafactory/ui/

      # The AWS identity preflight against fakeaws STS, the Layer 2 AMI
      # against fakeaws SSM, the Layer 3 scope claim, sweep and reap against
      # fakeaws STS, SSM and EC2, and Layer 2's AWS env through real tofu with
      # the network sealed (SealNetwork): every
      # service fakeaws serves without Docker, env-routed, and validate
      # needing fakeaws STS. S3 needs Docker (TestE2E_AWSFullStack).
      # `pitfalls check-avoid` retires on fakeaws, and every retired
      # avoid record in pitfalls/avoid-checks/ must still replay clean.
      # The Layer 2 seed of the resolved AMI runs from internal/cli,
      # whose tests alone can set that AMI.
      # fakeaws is pinned to one commit, so bumping FAKEAWS_SHA is a
      # deliberate edit. -count=1: the test cache cannot see the sibling
      # checkout, so a cached PASS could replay after a bump. `go test`
      # exits 0 when a test skips or no longer exists, so the step passes
      # only on each test's own PASS line.
      - name: AWS against fakeaws
        env:
          FAKEAWS_SHA: ece63928a1ecd9129aa7731544131ff8313009e3
          INFRAFACTORY_ENABLE_E2E: "1"
        run: |
          set -o pipefail
          git init -q ../fakeaws
          git -C ../fakeaws fetch -q --depth 1 https://github.com/redscaresu/fakeaws.git "$FAKEAWS_SHA"
          git -C ../fakeaws checkout -q FETCH_HEAD
          # fakeawsAtPin builds the rehearsal e2es' fakeaws from this clone, at the pin.
          export FAKEAWS_DIR="$(cd ../fakeaws && pwd)"
          # One build into the shared Go cache first, so the e2e's `go run`s
          # and fakeawsAtPin's builds do not compile fakeaws cold at
          # once and run StartFakeaws past its readiness wait.
          go build -C ../fakeaws -o /dev/null ./cmd/fakeaws
          tests=$(grep -v '^#' .github/fakeaws-e2e-tests)
          [ -n "$tests" ] || { echo "no tests listed in .github/fakeaws-e2e-tests"; exit 1; }
          go test ./internal/e2e ./internal/cli -run "^($(echo $tests | tr ' ' '|'))\$" -count=1 -timeout 18m -v | tee "$RUNNER_TEMP/aws-fakeaws.log"
          for test in $tests; do
            grep -q "^--- PASS: $test " "$RUNNER_TEMP/aws-fakeaws.log" || { echo "$test did not PASS"; exit 1; }
          done

  govulncheck:
    needs: board
    if: ${{ !cancelled() && !(needs.board.result == 'success' && needs.board.outputs.skip == 'true') }}
    timeout-minutes: 5
    # S150-T1. Nothing scanned Go dependencies for known vulnerabilities
    # before this, so a vulnerable module could ship silently.
    #
    # Symbol-level (the default) rather than -scan module, deliberately.
    # The tree currently requires golang.org/x/crypto v0.53.0, which carries
    # GO-2026-5932 with "Fixed in: N/A" -- no fix exists. A module-level gate
    # would be permanently red with no remedy available, and a check nobody
    # can act on is a check everybody learns to ignore. Symbol-level fails
    # only when our code actually reaches the vulnerable path, which is the
    # question worth blocking a merge on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        # -tags noui, and NOT for convenience. cmd/infrafactory/embed.go
        # carries `//go:embed all:ui/build`, and that directory is generated
        # and gitignored, so on a clean runner it does not exist and
        # `go build ./...` fails to load that package.
        #
        # govulncheck does not fail on it -- it exits 0 and says nothing.
        # It simply cannot analyse a package that will not load, so the
        # scan would quietly cover less than it appears to. A green result
        # that skipped a package is the kind of false green this repo has
        # been bitten by before. The noui build tag swaps the embed for a
        # stub so every package loads and is actually scanned.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags noui ./...

  gitleaks:
    # M72: mirror the local pre-commit hook + the 3 sibling-fake CI
    # jobs. The pre-commit hook is bypassable with --no-verify and
    # does not run on fork PRs, so this job is the load-bearing
    # secret scan for OSS-fork contributions.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --source=. --config .gitleaks.toml

  build-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Build UI (embedded via go:embed)
        run: |
          cd ui && npm ci && npm run build
          cd ..
          rm -rf cmd/infrafactory/ui/build
          mkdir -p cmd/infrafactory/ui
          cp -R ui/build cmd/infrafactory/ui/

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -o dist/infrafactory-linux-${{ matrix.arch }} ./cmd/infrafactory

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: infrafactory-linux-${{ matrix.arch }}
          path: dist/infrafactory-linux-${{ matrix.arch }}
