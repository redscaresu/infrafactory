version: "1.0"

agent:
  type: claude-code          # claude-code | openrouter
  repair_iterations_max: 5   # failure-triggered retry budget in run loop
  phase_delay_seconds: 0     # delay between claude -p calls (increase if rate limited)
  phases:
    - plan_architecture
    - generate_hcl
    - self_review
  claude:
    command: claude  # claude-code transport binary; set to an absolute path (e.g. /opt/homebrew/bin/claude on macOS+brew) if `claude` isn't on PATH
    phase_timeout_seconds: 300  # hard timeout per claude phase call
  openrouter:
    model: ""                # required when type=openrouter
    base_url: https://openrouter.ai/api/v1
    timeout_seconds: 60
    max_retries: 2

mockway:
  url: http://127.0.0.1:8080
  auto_reset: true

# fakegcp routes `cloud: gcp` scenarios. Optional — leave url empty if
# only running Scaleway scenarios. `make mocks-up` starts both mockway
# and fakegcp side-by-side at the URLs below.
fakegcp:
  url: http://127.0.0.1:8081
  auto_reset: true

# fakeaws routes `cloud: aws` scenarios (everything except S3 — see
# s3mock below). Optional.
fakeaws:
  url: http://127.0.0.1:8082
  auto_reset: true

# fakegenesys routes `cloud: genesys` scenarios (Genesys Cloud CCaaS
# mock). Default URL :8083 — added in S114-T7. Optional; leave url
# empty when not running Genesys scenarios.
fakegenesys:
  url: http://127.0.0.1:8083
  auto_reset: true

# s3 is the S3 backend used in place of fakeaws's built-in S3 handler
# for AWS scenarios touching aws_s3_bucket / aws_s3_object / etc.
# Default URL points at the s3router shim (S80), which fans S3 traffic
# between two backends:
#   - SeaweedFS (:9090) handles the data plane (bucket + object Put/Get).
#   - fakeaws (:8082, under /s3) handles bucket subresources SeaweedFS
#     doesn't model (today just ?publicAccessBlock; add to
#     cmd/s3router/main.go fakeawsSubresources as new 501s surface).
# To bypass the shim and point directly at SeaweedFS, set
# url: http://127.0.0.1:9090 — scenarios using public_access_block
# will then 501.
s3:
  url: http://127.0.0.1:9091
  auto_reset: true

scaleway:
  # Owns any Layer 3 resource whose HCL omits project_id. Per-run projects
  # are created by the stack itself (ADR-0010); this is purely a net for
  # resources that forget to reference one, so a stray lands somewhere
  # disposable instead of in the organization's default project next to
  # real infrastructure. Not a secret; leave empty to keep the provider
  # default. Created 2026-08-22 as the `infrafactory` project.
  fallback_project_id: "2397e80e-ec12-4a7e-819f-a2caba3867b6"
  credentials_source: env    # env | config-file

validation:
  layers:
    static:
      enabled: true
      policy_paths: [./policies/common, ./policies/scaleway, ./policies/gcp, ./policies/aws]
    mock_deploy:
      enabled: true
    sandbox_deploy:
      # Layer 3 applies to REAL Scaleway and spends real money.
      # Requires SCW_ACCESS_KEY, SCW_SECRET_KEY and
      # SCW_DEFAULT_ORGANIZATION_ID (the last one because each run
      # creates its own project — ADR-0010).
      enabled: false
      # Resource types allowed to reach a real apply. Exact names, or a
      # `scaleway_lb*` prefix. Deny-by-default: an empty or absent list
      # denies everything, so a config that forgets this stops the run
      # rather than provisioning whatever was generated. Omit the key
      # entirely to inherit the defaults in internal/config/config.go.
      allow_resource_types:
        - scaleway_account_project
        - scaleway_block_volume
        - scaleway_block_snapshot
        - scaleway_vpc
        - scaleway_vpc_private_network
        - scaleway_lb*
        - scaleway_domain*
        - scaleway_iam*
        - scaleway_registry_namespace
        # Named individually rather than as scaleway_instance_*: this is a
        # deny-by-default list, and a glob would also admit snapshots and
        # images that no scenario needs. Admitted so a load balancer can
        # have a backend that actually serves -- the difference between
        # proving an LB accepts TCP and proving it serves traffic
        # (ADR-0023, allowlist amendment). An instance boots in well under
        # a minute, unlike the clusters below.
        #
        # private_nic is here because policies/scaleway/vpc_required.rego
        # DENIES any instance server without one. Omitting it would leave
        # static policy demanding a resource this list forbids, so no
        # generated HCL could satisfy both gates.
        #
        # That rego IS evaluated for Scaleway. A 2026-08-30 claim that it
        # was "wired for AWS only" (because it is absent from
        # constraint_policies) was WRONG and is retracted:
        # filterPolicyPathsByCloud drops only OTHER clouds, so every
        # policies/scaleway/*.rego runs against the plan. A generation run
        # the same day failed on exactly this rule.
        #
        # Two things WERE established by canary on 2026-08-30:
        #
        #   1. The permission is PrivateNetworksFullAccess, not
        #      IPAMFullAccess. The real API asked for
        #      `write compute_private_networks`. Granted; private
        #      NETWORKS now create.
        #
        #   2. Private NICs still cannot be applied, and no permission
        #      fixes it:
        #
        #        Cannot create a private_network_interface in a project
        #        attached to a server from another project
        #
        #      scaleway_instance_private_nic takes no project_id -- it is
        #      a child resource, which is why layer3_hcl_shape.go lists it
        #      under parent references -- so the provider creates it in
        #      the DEFAULT project, which is scaleway.fallback_project_id,
        #      the ADR-0010 containment project, while the server lives in
        #      the run's own project.
        #
        # That contradiction -- Layer 1 requiring a NIC Layer 3 could not
        # apply -- was RESOLVED 2026-08-31 by the ADR-0025 cutover: the run's
        # project is created before the apply and is the provider default, so
        # the NIC lands with its server. The paragraph above is kept as the
        # record of the diagnosis, not as current state.
        #
        # 2026-09-09 replaced it with a narrower one, found by finally running
        # the thing: a STANDALONE NIC applies and then cannot be DESTROYED
        # ("Can't delete a private network interface attached to a server"),
        # because destroy runs in reverse dependency order and deletes the NIC
        # while its server is still running. Attach through the server's inline
        # `private_network` block instead; `vpc_required.rego` accepts either
        # shape and the pitfall prescribes the inline one. This entry stays
        # allowlisted so the standalone form still applies where it is used.
        - scaleway_instance_ip
        - scaleway_instance_server
        - scaleway_instance_private_nic
        # Uncommenting any of these opts into slow, genuinely costly
        # provisioning against real Scaleway. Clusters and HA database
        # instances take minutes to create AND minutes to destroy, on
        # every iteration of the repair loop.
        # - scaleway_k8s_cluster
        # - scaleway_k8s_pool
        # - scaleway_rdb_instance
        # - scaleway_redis_cluster
    destruction:
      enabled: true
  real_probes:
    timeout_seconds: 5
    # 24 attempts. A 503 answers immediately, so the wall clock is the
    # delays: ~120s, sized to a real cold boot rather than to a guess. A
    # black-holed endpoint pays the timeout as well -- 24 x (5s + 5s) ~= 235s.
    #
    # 30s (the old 6 x 5s) is shorter than a Scaleway instance takes to boot and
    # start serving, so an `http_probe` failed while the stack was still coming
    # up -- and it failed as a 503 from a healthy load balancer with no healthy
    # backend, which is indistinguishable from a broken app. Against real
    # Scaleway that false negative is expensive: the repair loop regenerates and
    # applies again, so every wrong verdict costs another real apply and destroy.
    #
    # A probe window is a claim about how long real infrastructure takes. Ours
    # was wrong by 3x on 2026-09-09 (web-live-paris, two iterations lost).
    retries: 24
    retry_delay_seconds: 5

constraint_policies:
  no_public_database: scaleway/no_public_database.rego
  encryption_at_rest: scaleway/encryption_at_rest.rego
  no_public_endpoints: scaleway/no_public_endpoints.rego
  # region_restriction is the criterion `check:` value post-S51 (the
  # migration renamed from constraint-key `region` to policy-name
  # `region_restriction` to make the criterion self-documenting).
  # Keep the legacy `region` + `zone` keys for backwards compat with
  # any external scenario YAML still using the pre-S51 names.
  region_restriction: scaleway/region_restriction.rego
  region: scaleway/region_restriction.rego
  zone: scaleway/region_restriction.rego

paths:
  scenarios: ./scenarios
  mappings: ./mappings.yaml
  output: ./output
  policies: ./policies
  prompts: ./prompts
  pitfalls: ./pitfalls
